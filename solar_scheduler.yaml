substitutions:
  # Position (modifier puis recompiler : sun: n'accepte pas de valeurs dynamiques)
  latitude: "50.4674"
  longitude: "4.8675"
  # Relais (éviter GPIO2/8/9 sur ESP32-C3 : broches de strapping)
  relay_pin: GPIO4
  relay_inverted: "false"

esphome:
  name: solar-scheduler
  friendly_name: Solar Scheduler
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - script.execute: appliquer_etat

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "Solar-Scheduler-AP"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  # Pas de reboot si Home Assistant est absent (chaque reboot = glitch relais)
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

web_server:
  port: 80
  version: 3
  auth:
    username: admin
    password: !secret web_password

time:
  - platform: sntp
    id: sntp_time
    update_interval: 6h
    timezone: Europe/Brussels
    on_time_sync:
      - script.execute: appliquer_etat

sun:
  id: soleil
  latitude: ${latitude}
  longitude: ${longitude}

sensor:
  - platform: template
    name: "Heure Lever de Soleil"
    id: heure_lever
    lambda: |-
      auto t = id(soleil).sunrise(-0.833);
      if (!t.has_value()) return {};
      return t->hour + t->minute / 60.0f;
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: 1min
    icon: "mdi:weather-sunset-up"
    entity_category: diagnostic
  - platform: template
    name: "Heure Coucher de Soleil"
    id: heure_coucher
    lambda: |-
      auto t = id(soleil).sunset(-0.833);
      if (!t.has_value()) return {};
      return t->hour + t->minute / 60.0f;
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: 1min
    icon: "mdi:weather-sunset-down"
    entity_category: diagnostic
  - platform: sun
    sun_id: soleil
    name: "Soleil Élévation"
    type: elevation
    update_interval: 10min
    icon: "mdi:chart-gantt"
    entity_category: diagnostic

switch:
  - platform: gpio
    name: "Contrôle Relais"
    id: controle_relais
    pin:
      number: ${relay_pin}
      inverted: ${relay_inverted}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - logger.log: "Relais activé"
    on_turn_off:
      - logger.log: "Relais désactivé"

select:
  - platform: template
    name: "Mode"
    id: mode
    icon: "mdi:calendar-clock"
    options:
      - "Horaire Fixe"
      - "Sunrise"
      - "Sunset"
    initial_option: "Horaire Fixe"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: appliquer_etat

number:
  - platform: template
    name: "Offset Sunrise (min)"
    id: offset_sunrise
    min_value: -120
    max_value: 120
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    on_value:
      - script.execute: appliquer_etat
  - platform: template
    name: "Offset Sunset (min)"
    id: offset_sunset
    min_value: -120
    max_value: 120
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    on_value:
      - script.execute: appliquer_etat

datetime:
  - platform: template
    name: "Heure Fixe (ON)"
    id: heure_fixe_on
    type: time
    initial_value: "08:00:00"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: appliquer_etat
  - platform: template
    name: "Heure Fixe (OFF)"
    id: heure_fixe_off
    type: time
    initial_value: "18:00:00"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: appliquer_etat

script:
  # Évaluation par niveau : calcule l'état voulu pour l'instant présent et ne
  # commande le relais que s'il diffère. Appelé au boot, après chaque synchro
  # SNTP, à chaque changement de réglage et toutes les 30 s (rattrape tout
  # événement manqué : tick sauté, saut d'horloge, changement d'heure).
  - id: appliquer_etat
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;
          std::string m = std::string(id(mode).current_option());
          bool on = id(controle_relais).state;
          if (m == "Horaire Fixe") {
            int cur = now.hour * 60 + now.minute;
            int a = id(heure_fixe_on).hour * 60 + id(heure_fixe_on).minute;
            int b = id(heure_fixe_off).hour * 60 + id(heure_fixe_off).minute;
            if (a == b) {
              // ON == OFF : fenêtre vide, relais OFF
              on = false;
            } else {
              on = (a < b) ? (cur >= a && cur < b) : (cur >= a || cur < b);
            }
          } else if (m == "Sunrise" || m == "Sunset") {
            // Dernier événement passé (offset inclus) parmi plusieurs jours :
            // lever -> jour (OFF), coucher -> nuit (ON). Si aucun événement
            // (jour/nuit polaire) l'état est inchangé.
            time_t t = now.timestamp;
            int off_sr = (int) id(offset_sunrise).state * 60;
            int off_ss = (int) id(offset_sunset).state * 60;
            time_t last_sr = 0, last_ss = 0;
            for (int k = -2; k <= 1; k++) {
              auto d = ESPTime::from_epoch_local(t + k * 86400);
              auto sr = id(soleil).sunrise(d, -0.833);
              auto ss = id(soleil).sunset(d, -0.833);
              if (sr.has_value()) {
                time_t e = sr->timestamp + off_sr;
                if (e <= t && e > last_sr) last_sr = e;
              }
              if (ss.has_value()) {
                time_t e = ss->timestamp + off_ss;
                if (e <= t && e > last_ss) last_ss = e;
              }
            }
            if (last_sr != 0 || last_ss != 0) on = last_ss > last_sr;
          }
          if (on != id(controle_relais).state) {
            ESP_LOGI("solar", "Mode %s: relais %s", m.c_str(), on ? "ALLUMÉ" : "ÉTEINT");
            if (on) id(controle_relais).turn_on(); else id(controle_relais).turn_off();
          }

interval:
  - interval: 30s
    then:
      - script.execute: appliquer_etat
