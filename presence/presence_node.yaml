    ld2410_id: radar
    has_target:
      id: radar_cible
      name: "Cible radar"
      web_server:
        sorting_group_id: grp_presence
    has_moving_target:
      name: "Cible en mouvement"
      web_server:
        sorting_group_id: grp_presence
    has_still_target:
      name: "Cible statique"
      web_server:
        sorting_group_id: grp_presence
  # Présence lissée : s'allume tout de suite, s'éteint après le délai de maintien
  - platform: template
    id: presence
    name: "Présence"
    web_server:
      sorting_group_id: grp_presence
    device_class: occupancy
    lambda: "return id(radar_cible).state;"
    filters:
      - delayed_off: !lambda "return (uint32_t) (id(delai_maintien).state * 1000);"
    on_press:
      then:
        - script.execute:
            id: piloter_lampes
            allumer: true
    on_release:
      then:
        - script.execute:
            id: piloter_lampes
            allumer: false

