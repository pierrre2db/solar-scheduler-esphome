substitutions:
  # Identité du nœud (un fichier par pièce : copier et changer name/friendly_name)
  name: presence-salon
  friendly_name: Presence Salon
  # Lampe pilotée via Home Assistant (entity_id d'un light.* ou switch.*) ; valeur initiale, modifiable dans la page web
  lamp_entity: light.salon
  # Lampe ESPHome pilotée en direct (API REST de web_server, sans HA) :
  # http://<ip>/<domaine>/<id> avec domaine = light ou switch, id = id de l'entité sur la lampe
  # Valeurs initiales : modifiables ensuite dans la page web du nœud (Lampes > "Lampe N URL")
  lamp_http_base: http://192.168.1.60/light/lampe
  # Lampes supplémentaires (laisser "" si inutilisées) : jusqu'à 3 lampes par nœud
  lamp_http_base_2: ""
  lamp_http_base_3: ""
  # Serveur de temps local (Pico W, voir presence/pico_w_timesync) ; pool.ntp.org en secours
  ntp_server: 192.168.1.50
  # Position (le mode "Nuit seulement" utilise le soleil, comme solar_scheduler.yaml)
  latitude: "50.4674"
  longitude: "4.8675"
  # UART du radar LD2410 (UART0 reste au logger)
  radar_tx_pin: GPIO5
  radar_rx_pin: GPIO6

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # Latence minimale : sans ça, le radio dort entre les beacons (+100 ms de jitter)
  power_save_mode: none
  # Hotspot de secours : ouvert si le WiFi est introuvable pendant 60 s (box changée, mauvais mot de passe)
  ap:
    ssid: "${friendly_name} AP"
    password: !secret ap_password
    ap_timeout: 60s

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key
  # Sans Home Assistant, aucun client API ne se connecte : par défaut l'appareil
  # redémarrerait toutes les 15 min (la lampe se rééteindrait). 0s = jamais.
  reboot_timeout: 0s

# Page de configuration (http://<ip>/) : toutes les entités regroupées par thème
web_server:
  port: 80
  version: 3
  auth:
    username: admin
    password: !secret web_password
  sorting_groups:
    - id: grp_presence
      name: "Présence"
      sorting_weight: 10
    - id: grp_lampes
      name: "Lampes"
      sorting_weight: 20
    - id: grp_calibrage
      name: "Calibrage"
      sorting_weight: 30
    - id: grp_seuils
      name: "Seuils par porte"
      sorting_weight: 40
    - id: grp_energies
      name: "Énergies par porte"
      sorting_weight: 50
    - id: grp_systeme
      name: "Système"
      sorting_weight: 60

# Pilotage direct des lampes ESPHome (POST sur web_server), sans passer par Home Assistant
http_request:
  timeout: 2s
  watchdog_timeout: 5s

time:
  - platform: sntp
    id: sntp_time
    update_interval: 15min
    timezone: Europe/Brussels
    servers:
      - ${ntp_server}
      - 0.pool.ntp.org
      - 1.pool.ntp.org

sun:
  id: soleil
  latitude: ${latitude}
  longitude: ${longitude}

uart:
  id: uart_radar
  tx_pin: ${radar_tx_pin}
  rx_pin: ${radar_rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: radar
  uart_id: uart_radar

globals:
  # Pic d'énergie observé par porte (0-8) pendant le calibrage, pièce vide
  - id: cal_max_move
    type: std::array<float, 9>
  - id: cal_max_still
    type: std::array<float, 9>
  - id: calibrage_actif
    type: bool
    initial_value: "false"

sensor:
