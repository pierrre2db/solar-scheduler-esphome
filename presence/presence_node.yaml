  - platform: template
    name: "Hotspot WiFi (reset)"
    web_server:
      sorting_group_id: grp_systeme
    icon: "mdi:wifi-cog"
    entity_category: config
    on_press:
      then:
        - lambda: 'wifi::global_wifi_component->save_wifi_sta("hotspot-reset", "hotspot-reset");'
        - delay: 1s
        - lambda: 'App.safe_reboot();'

script:
  # Allume (allumer=true) ou éteint les lampes, par Home Assistant et/ou HTTP selon le mode.
  # L'extinction n'est jamais bloquée par "Nuit seulement".
  - id: piloter_lampes
    parameters:
      allumer: bool
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_lampe
              - lambda: |-
                  if (!allumer || !id(nuit_seulement).state) return true;
                  // heure inconnue (ni Pico W ni NTP joignables) : on allume plutôt que de rester dans le noir
                  if (!id(sntp_time).now().is_valid()) return true;
                  return id(soleil).elevation() < -0.833;
          then:
            - if:
                condition:
                  lambda: 'return id(mode_lampe).current_option() != "HTTP direct";'
                then:
                  - if:
                      condition:
                        lambda: 'return allumer;'
                      then:
                        - homeassistant.action:
                            action: homeassistant.turn_on
                            data:
                              entity_id: !lambda 'return id(ha_entity).state;'
                      else:
                        - homeassistant.action:
                            action: homeassistant.turn_off
                            data:
                              entity_id: !lambda 'return id(ha_entity).state;'
            - if:
                condition:
                  lambda: 'return id(mode_lampe).current_option() != "Home Assistant";'
                then:
                  - script.execute:
                      id: lampe_http
                      base: !lambda 'return id(lamp_url_1).state;'
                      commande: !lambda 'return allumer ? "turn_on" : "turn_off";'
                  - script.execute:
                      id: lampe_http
                      base: !lambda 'return id(lamp_url_2).state;'
                      commande: !lambda 'return allumer ? "turn_on" : "turn_off";'
                  - script.execute:
                      id: lampe_http
                      base: !lambda 'return id(lamp_url_3).state;'
                      commande: !lambda 'return allumer ? "turn_on" : "turn_off";'

  # POST direct sur l'API REST de web_server d'une lampe ; 1 nouvel essai si échec.
  # Appelé une fois par lampe (base vide = lampe non configurée, ignorée).
  # File d'attente : une lampe hors ligne retarde les suivantes de ~5 s au plus.
  - id: lampe_http
    mode: queued
    parameters:
      base: string
      commande: string
    then:
      - if:
          condition:
            lambda: 'return !base.empty();'
          then:
            - http_request.post:
                url: !lambda 'return base + "/" + commande;'
                request_headers:
                  Authorization: !secret lamp_http_basic
                capture_response: false
                on_error:
                  - logger.log:
                      level: WARN
                      format: "Lampe HTTP %s/%s : échec, nouvel essai"
                      args: ['base.c_str()', 'commande.c_str()']
                  - delay: 500ms
                  - http_request.post:
                      url: !lambda 'return base + "/" + commande;'
                      request_headers:
                        Authorization: !secret lamp_http_basic
                      capture_response: false

  # Calibrage : pièce vide pendant "Calibrage durée". On relève le pic d'énergie de
  # chaque porte puis seuil = pic + marge (plafonné à 100).
  - id: calibrer
    mode: single
    then:
      - lambda: |-
          id(cal_max_move).fill(0);
          id(cal_max_still).fill(0);
          id(calibrage_actif) = true;
          id(cal_statut).publish_state("Calibrage en cours : quitter la pièce");
      - switch.turn_on: mode_ingenieur
      - delay: !lambda "return (uint32_t) id(cal_duree).state * 1000;"
      - lambda: |-
          id(calibrage_actif) = false;
          id(cal_statut).publish_state("Application des seuils");
      - script.execute: appliquer_seuils
      - switch.turn_off: mode_ingenieur
      - lambda: |-
          std::string s = "OK (marge " + to_string((int) id(cal_marge).state) + ") pics mvt:";
          for (float v : id(cal_max_move)) s += " " + to_string((int) v);
          id(cal_statut).publish_state(s);

  # Écrit les 18 seuils avec une pause : le LD2410 traite une commande à la fois.
  - id: appliquer_seuils
    mode: single
    then:
      - repeat:
          count: 9
          then:
            - lambda: |-
                number::Number *mv[9] = {id(g0_move_threshold), id(g1_move_threshold), id(g2_move_threshold), id(g3_move_threshold), id(g4_move_threshold), id(g5_move_threshold), id(g6_move_threshold), id(g7_move_threshold), id(g8_move_threshold)};
                int g = iteration;
                float marge = id(cal_marge).state;
                auto m = mv[g]->make_call();
                m.set_value(std::min(100.0f, std::ceil(id(cal_max_move)[g] + marge)));
                m.perform();
            - delay: 300ms
            - lambda: |-
                number::Number *st[9] = {id(g0_still_threshold), id(g1_still_threshold), id(g2_still_threshold), id(g3_still_threshold), id(g4_still_threshold), id(g5_still_threshold), id(g6_still_threshold), id(g7_still_threshold), id(g8_still_threshold)};
                int g = iteration;
                float marge = id(cal_marge).state;
                auto s = st[g]->make_call();
                s.set_value(std::min(100.0f, std::ceil(id(cal_max_still)[g] + marge)));
                s.perform();
            - delay: 300ms
